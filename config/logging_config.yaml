version: 1
# Mantiene habilitado loggers de terceros
disable_existing_loggers: false
# Formatters
formatters:
  detailed:
    format: '%(asctime)s [%(levelname)s] (%(lineno)d) %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  simple:
    format: '[%(asctime)s] (%(levelname)s) %(message)s'
    datefmt: '%H:%M:%S'
# Handlers
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: detailed
    filename: info.log
    mode: a
# Para un logger concreto
loggers:
  pymongo:
    level: INFO
# Root
root:
  level: INFO
  handlers:
    - console
    - file